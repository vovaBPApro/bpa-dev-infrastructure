name: ${COMPOSE_PROJECT_NAME:-contour-acceptance}

services:
  daemon:
    build:
      context: ..
      dockerfile: stand/Dockerfile
    env_file:
      - ./env.example
    environment:
      TELEGRAM_DAEMON_PORT: "4822"
      TELEGRAM_DAEMON_HOST: "0.0.0.0"
    ports:
      - "${HOST_PORT:-18482}:4822"
    mem_limit: 256m
    cpus: "0.50"
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:4822/health'); if (!response.ok) process.exit(1)"
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
