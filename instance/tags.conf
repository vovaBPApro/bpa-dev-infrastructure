# Closed tag vocabulary for instruction-doc frontmatter and compose --tags.
#
# Per migration-prep/INSTRUCTIONS_CONSILIUM_FINAL.md §2.3: the tag vocabulary is
# CLOSED. A tag that appears in a doc's frontmatter OR in a `compose --tags`
# request but is NOT listed here is a hard error (non-zero exit). This kills
# silent tag typos that would otherwise deselect a rule invisibly.
#
# One tag per line. `#` comments and blank lines are ignored. Keep this list in
# sync when a doc introduces a new tag; the pack-coverage check backstops it.

# --- Routing / instruction system ---
routing              # the instruction-layer routing rule
instruction-layers   # the three-layer model itself
decision             # a decisions-ledger entry
instance             # instance-specific facts (operator, host, registry)
instance-candidate   # doc slated to move into instance/ in a later lane

# --- Git / lane / landing ---
git                  # git model and conventions
branching            # branch model
lane                 # lane scope and evidence contract
lifecycle            # lane lifecycle stages
landing              # serialized landing on the canonical tree
merge                # merge mechanics

# --- Roles / orchestration ---
roles                # role duties and boundaries
orchestrator         # orchestrator-specific playbook
playbook             # operating playbooks
autonomy             # autonomy scope and the irreversible set
capacity             # fleet capacity / saturation
workboard            # the workboard / open-work tracking
vendor               # vendor / model routing
routing-vendor       # (forward) explicit vendor-routing tag slot

# --- Verification / testing ---
verification         # verification gates
regression-lock      # regression-lock law
testing              # test discipline
isolation            # isolated checkouts and outputs
multi-project        # per-project state isolation
stands               # docker stands
docker               # docker/runtime evidence
scenarios            # named test scenarios

# --- Workflow / planning ---
workflow             # lifecycle and scope control
planning             # planning discipline
specs                # specification style
development-workflow # (forward) explicit workflow tag slot

# --- Human / feedback ---
human                # Human authority and requirements
verbatim             # verbatim Human words
feedback             # operator feedback as test evidence
operator-profile     # operator-specific collaboration preferences

# --- Security / permissions ---
security             # security posture
trust                # trust boundaries
prompt-injection     # untrusted-content handling
permissions          # permission surface
fail-closed          # fail-closed defaults
secrets              # secret handling

# --- Repo hygiene / durability ---
hygiene              # repo hygiene
repo-layout          # target repo layout / registry
restart              # restart handling
recovery             # recovery from durable records
durability           # durable-state discipline

# --- Review ---
review               # review as a risk/evidence gate
risk                 # risk tiering

# --- UI / design ---
ui                   # UI work
design               # design system
quality              # design-quality bar

# --- Language / stack conventions (L2-parked) ---
lang                 # language-convention docs
typescript           # TypeScript guidelines
react                # React guidelines
documentation        # documentation philosophy

# --- Traceability / history ---
incidents            # incident traceability
traceability         # failure-to-rule traceability
lessons              # distilled operating lessons
migration            # migration runbooks
runbook              # operator runbooks

# --- Forward slots (reserved; no doc uses these yet) ---
# Declared ahead of the docs that will carry them so a lane can request the
# tag before the doc lands without tripping the unknown-tag refusal.
onboarding           # (forward) onboarding flows
