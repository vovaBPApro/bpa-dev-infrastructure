# Installation facts for unprivileged agent lanes. No credentials belong here.
# Authenticate each provider as this account (for example via
# `sudo -u bpa-lane -H claude login` and `sudo -u bpa-lane -H codex login`).
# Provider state then lives below lane_home, whose mode is 0700; only bpa-lane
# and root can read it. Do not copy root's provider directories or broaden modes.
lane_user=bpa-lane
lane_group=bpa-lane
lane_home=/var/lib/bpa-lane
lanes_dir=/srv/bpa-infra-lanes
