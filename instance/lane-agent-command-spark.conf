# One argv entry per line. The generic launcher treats this file as data and
# does not know the provider; this file is the this-installation fact.
#
# 2026-08-04, operator instruction (Telegram 2092): Spark is a SEPARATE quota
# bucket from the shared Codex/Robota weekly limit. On 2026-08-04 that shared
# bucket was at 6% with 0 credits while Spark sat at 97% untouched, so
# mechanical lanes belong here — it stretches the exhausted bucket instead of
# competing with it. Verified live before use: codex exec --model
# gpt-5.3-codex-spark returned the expected token.
#
# Reviewers and design rows do NOT belong here. Every real hole found on
# 2026-08-04 was found by a reviewer executing an attack, not reading code.
#
# 2026-08-04, V3-0.51 — foreground-command bound: MEASURED, not assumed. The
# claude-family confs must declare BASH_DEFAULT_TIMEOUT_MS/BASH_MAX_TIMEOUT_MS
# because that harness kills a foreground command at 120000 ms undeclared. This
# CLI does not: probed with a 150 s foreground command, it completed
# (elapsed 158 s), so no bound entry is set here. Re-measure with
#   orchestrator/fleet/probe-foreground-bound.sh --agent-command <this file> \
#     --sleep-seconds 150 --expect completed
# The probe names no variable and no provider, so it answers this question for
# whatever CLI this file points at. Note what is NOT claimed: that this CLI has
# no bound at all, only that it did not kill at 150 s.
env
IS_SANDBOX=1
codex
exec
--dangerously-bypass-approvals-and-sandbox
--model
gpt-5.3-codex-spark
