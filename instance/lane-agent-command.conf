# One argv entry per line. The generic launcher treats this file as data and
# does not know the provider; this file is the this-installation fact.
#
# 2026-08-04: worker lanes run on Anthropic by operator instruction (Telegram
# 2082) — the Codex weekly limit was down to 6% remaining with 0 credits, while
# the Anthropic quota had just reset. The previous Codex argv is retained at
# instance/lane-agent-command-codex.conf so switching back is a one-line change,
# not an archaeology exercise.
#
# IS_SANDBOX=1 is required because lanes still run as root on this host: the
# claude CLI refuses --dangerously-skip-permissions under root without it. That
# is a symptom of V3-1.9 (non-root lanes) not having landed, not a preference.
#
# 2026-08-04, V3-0.51: the two BASH_*_TIMEOUT_MS entries declare the bound this
# harness applies to a FOREGROUND command. Left undeclared it is 120000 ms, and
# a lane cannot see it, did not choose it, and is not told when it fires. This
# repository's own suite measured 98-155 s across nine runs (128.79 s at
# e624ff2), so the undeclared bound sits INSIDE the suite's range. A straddled
# bound is worse than a tight one: the same command passes or dies run to run.
# The kill arrives as SIGTERM (exit 143) with truncated output and no trailing
# summary, and through an unguarded pipe that becomes exit 0 (V3-0.40,
# gate/completion-guard.ts:131) — a truncated green. That composition is the
# symptom V3-0.23 chased for four rounds, and it is invisible from outside a
# lane, which is why five runs in an operator shell never reproduced it.
#
# 1800000 ms is chosen against the longest bound any mechanism a lane invokes
# enforces on ITSELF: gate/land-lib.sh runs the meteorite prover under
# LAND_METEORITE_TIMEOUT_SECONDS (default 900). A harness bound tighter than an
# inner mechanism's own bound replaces that mechanism's honest timeout report
# with a truncated kill, so the outer bound must clear 900 s plus the suite plus
# the remaining gate steps, with headroom.
#
# Checked and deliberately NOT a conflict: orchestrator/watchdog.sh treats an
# orchestrator turn as stale at ORCH_HEARTBEAT_MAX_AGE (1200 s), which is BELOW
# the number here. It does not bind this file. These confs are consumed only by
# orchestrator/fleet/launch-lane.sh, which runs each lane as a transient systemd
# unit; the heartbeat supervises the orchestrator's tmux session, which is
# launched by another path entirely. The watchdog also stopped treating a long
# turn as death outright — it wins on the newer tmux pane-output signal, because
# a single long turn is ordinary for that role.
#
# DEFAULT and MAX carry the SAME value deliberately: one declared number, which
# no individual call may exceed. DEFAULT alone is not sufficient — the harness
# caps a requested per-call timeout at MAX, whose undeclared value (600000 ms)
# is below the number wanted here.
#
# Verified by execution, not by plausible name — re-run:
#   orchestrator/fleet/probe-foreground-bound.sh --agent-command <this file> \
#     --sleep-seconds 660 --expect completed
#
# 2026-08-05, V3-3.10 (instance/specs/token-usage-accounting.md, HR-2377): the
# two --output-format/--verbose entries are what makes token and cost
# accounting possible at all. Plain --print reports no usage; stream-json
# carries a terminal result event with input, output, cache-creation and
# cache-read token counts and the CLI's own total_cost_usd.
#
# --verbose is NOT optional and not a logging preference: `--print` with
# `--output-format=stream-json` is refused outright without it ("Error: When
# using --print, --output-format=stream-json requires --verbose"), so dropping
# it does not make lanes quieter, it stops them launching.
#
# This does NOT change the lane log. daemon/mask-stream.ts renders the events
# back to the same plain text --print produced, and daemon/mask-stream.test.ts
# asserts that byte-for-byte against a captured sample of the old output. If
# that pairing is ever broken, the log fills with raw JSON — so these two lines
# and the masker's --format stream-json flag move together or not at all.
env
IS_SANDBOX=1
BASH_DEFAULT_TIMEOUT_MS=1800000
BASH_MAX_TIMEOUT_MS=1800000
claude
--print
--output-format
stream-json
--verbose
--dangerously-skip-permissions
--model
claude-opus-5
