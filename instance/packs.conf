# Per-role baseline context packs.
#
# Per migration-prep/INSTRUCTIONS_CONSILIUM_FINAL.md §2.3: the baseline pack for
# a role is ALWAYS included in full. `compose --tags` ADDS matching docs on top;
# it can never remove a baseline entry. This is the fail-closed floor against
# silent tag-deselection (F1).
#
# Format: one section per role header `[<role>]`, then one doc id per line.
# `#` comments and blank lines are ignored. Every id must resolve to a doc in
# instructions/ whose audience is that role or `all` (the compose loader and the
# pack-coverage check both enforce this). Keep each baseline lean — the lane
# contract, report shape, regression-lock law, tool permissions, and the
# routing rule are the shared spine; role packs add only what that role always
# needs.

[coder]
lane-lifecycle           # the lane's scope + evidence contract from dispatch to reap
verification-and-locks   # regression-lock / visual-lock / false-green law — every fix needs it
tool-permissions         # fail-closed permission surface a lane operates under
repository-hygiene       # what may and may not enter git; secret discipline
isolated-test-environments  # never mutate the canonical tree for a lane test
operator-feedback        # treat operator input as test evidence; preserve defining words
instruction-layers       # where a rule lives / how routing works (shared spine)
branching-policy         # the ag-<lane> branch model a coder works within

[reviewer]
review-policy            # review as a risk + evidence gate (the reviewer's core contract)
verification-and-locks   # a fix without a locking test is rejected — reviewer enforces it
roles                    # role boundaries; who reviews what
instruction-layers       # shared routing spine
tool-permissions         # permission surface is review scope

[orchestrator]
orchestrator-playbook    # dispatch / verify / land / clean / report; do not author code
autonomy-and-capacity    # execute approved dev-only work now; keep the fleet saturated
landing-and-merge        # serialized landing on the canonical tree
restart-recovery         # reconstruct state from durable records after a restart
vendor-routing           # route work by risk / independence / capacity
roles                    # role boundaries the orchestrator enforces
instruction-layers       # shared routing spine

[manager]
orchestrator-playbook    # a manager is a dispatched orchestrator-agent; same untouchable-code rule
autonomy-and-capacity    # keep assigned lanes saturated; escalate only the irreversible set
landing-and-merge        # landing discipline for the lanes it verifies
roles                    # role boundaries
instruction-layers       # shared routing spine
