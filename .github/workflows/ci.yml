name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bun-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install daemon dependencies
        working-directory: daemon
        run: bun install --frozen-lockfile
      - name: Run daemon Bun tests
        run: bun test daemon/*.test.ts
      - name: Run core Bun tests
        run: bun test core/*.test.ts
      - name: Run gate Bun tests
        run: bun test gate/*.test.ts
      - name: Run stand Bun tests
        run: bun test stand/*.test.ts

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run shell tests
        run: |
          bootstrap/bootstrap.test.sh
          hygiene/reap.test.sh
          workspace/workspace.test.sh
          if [[ -f gate/land.test.sh ]]; then
            gate/land.test.sh
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Lint tracked shell scripts
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck --exclude=SC2034,SC2015,SC2016

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Scan for credentials
        shell: bash
        run: |
          secret_pattern='[0-9]{8,10}:''AA|'
          secret_pattern+='gh''p_|github''_pat|client''_secret|PRIVATE'' KEY'
          if grep -rE --exclude-dir=.git "$secret_pattern" .; then
            echo 'ERROR: credential-like value detected' >&2
            exit 1
          else
            scan_status=$?
            if [[ "$scan_status" -ne 1 ]]; then
              exit "$scan_status"
            fi
          fi
