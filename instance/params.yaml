# Instance parameters for this BPA control-plane deployment.
#
# Every value here is a this-installation fact. Generic instructions/ rules cite
# these parameters by name instead of hard-coding a name or number. Each entry
# cites the source doc in THIS repo that establishes it. No secrets/tokens/keys.

operator:
  name: Vova                       # instructions/repo-layout.md, STACK_DECISION.md verbatim blocks (Vova)
  language: uk                     # CLAUDE.md Hard Rule 17 (chat with the Human in Ukrainian)
  timezone: Europe/Warsaw          # migration-prep/HUMAN_REQUIREMENTS_MATRIX_2026-07-28.md (Kraków clock; morning rhythm)

phase:
  current: sole-mission            # instance/README + CLAUDE.md Mission (this repo is the sole current mission)
  # Predicate used by instruction `sunset:` frontmatter, per
  # migration-prep/INSTRUCTIONS_CONSILIUM_FINAL.md §2.1, §4.2.
  active_scope: instruction-mechanics-only   # instance/decisions/HR-11570.md (Vova 11570): active work is ONLY the
  # L1 instruction tooling/restructure in this repo (checker, frontmatter, generated
  # index, compose/packs, inbox capture, scaffold), each with thorough tests and a
  # real-repo run before landing. VM migration and stack Phase 0 are parked awaiting
  # his go. This is the pack-visible home of the HR-11570 restriction (that row is
  # state: routed, so it is provenance, not pack-delivered — see instruction-layers.md).

repos:
  control_plane: bpa-dev-infrastructure   # instructions/repo-layout.md (this repo, control plane only)
  framework: planned                      # instructions/repo-layout.md (a NEW separate repo, not yet created)
  per_agent: planned                      # instructions/repo-layout.md (one NEW repo per agent: Bill, Mila, future)
  legacy_donors:                          # instructions/repo-layout.md (read-only donors, deleted over time)
    - bpa-master
    - agent-bill
    - agent-mila
  legacy_rescue_branch: rescue/vm-final-20260728   # instructions/repo-layout.md
  canonical_root: /root/bpa-dev-infrastructure     # AS BUILT on bpa-infra after the 2026-07-30 cutover.
  account: root                     # SYSTEM-unit deployment contract; bootstrap refuses non-root activation.
  git_remote: git@github.com:vovaBPApro/bpa-dev-infrastructure.git  # instance/migration-day.md (clone step)

vm:
  os: Ubuntu 24.04                 # instance/migration-day.md
  host: bpa-infra                  # AS BUILT (hostname), 2026-07-30 cutover per instance/decisions/HR-11736.md
  ip: 144.76.185.238               # AS BUILT, cutover target named in instance/decisions/HR-11736.md
  cores: 12                        # AS BUILT (nproc)
  ram_gb: 251                      # AS BUILT (free -g). The 64 GB in migration-day.md / repo-layout.md
  # (msg 11555) was Vova's sizing FLOOR, not this box; the delivered machine exceeds it.

fleet:
  # ACTIVE as of 2026-07-31 — instance/decisions/HR-281.md (Vova, verbatim; the
  # row covers his Telegram 275 + 281 together, so cite 281 — HR-275.md does not
  # exist and an earlier version of this comment pointed at it).
  # This band was marked `suspended` as a leftover of the legacy control plane,
  # and the orchestrator used that as licence to work single-threaded on a
  # 12-core / 251 GB box while Codex sat at 92% unused quota. He called that out
  # directly: parallelism is the reason the server is paid for.
  floor: 10                        # HIS TARGET (2026-07-31): «У тебе задача — десять лейнів стабільно тримати»
  ceiling: 15                      # upper bound; raise only with measured host headroom
  notify_human_below: 3            # below this the watchdog messages HIM directly, not just the orchestrator
  keepalive_interval_minutes: 15   # daemon timer backstop; independent of lane exit events
  status: active
  # Enforced by the state-contract checker: open work plus zero measured system
  # lane units is FLEET-IDLE; an unavailable system lane count also fails closed.
  fleet_idle_check: tools/state-contract/check.ts:FLEET-IDLE

orchestrator:
  # A doc in THIS repo now states the vendor shape, so the long-standing "no
  # model/vendor map here" omission is lifted for these keys only.
  top_provider: codex              # HUMAN RULING: instance/decisions/HR-271.md (Vova, 2026-07-31).
  # The top orchestrator is Codex gpt-5.6-sol. Claude is reserved ENTIRELY: not
  # spent on routing, only on short-lived Sonnet errand-agents for the claude.ai
  # connectors (Drive/Gmail/QuickBooks) and Fable for real escalation. This
  # replaces the "thin Claude top" shape from handoff-oldorch-2026-07-30.md §1.
  top_posture: thin                # unchanged in KIND — routing/decisions/Human contact only
  # Pinned in source (orchestrator/launch.sh CLAUDE_MODEL) for the same reason
  # as fallback_model below: an unpinned claude launch emits no --model and the
  # top orchestrator silently becomes the account default.
  # SUPERSEDED 2026-07-31 by HR-271: the top orchestrator is no longer Claude at
  # all (see top_provider: codex above, and fallback_model: gpt-5.6-sol below,
  # which is now the TOP model rather than the fallback). This key survives only
  # as the tier to use IF a Claude top is ever run again, and as the tier for the
  # Sonnet errand-agents. HR-269's reasoning below still explains why NOT Fable.
  top_model: claude-sonnet-5       # HUMAN RULING: instance/decisions/HR-269.md (Vova, 2026-07-31).
  # Rest on Sonnet — NOT Fable, NOT Opus. Fable is escalation-only because his own
  # usage screenshots show it is his TIGHTEST bucket (79% used), so resting there
  # would eat the reserve he wants kept for hard problems. This SUPERSEDES his
  # 2026-07-30 "thin top on Fable" position by his own evidence, same goal.
  # CORRECTION 2026-07-31: this key previously read `claude-fable-5` and claimed
  # "AS RUN ... confirmed by the launcher -> claude_model=claude-fable-5". That was
  # FALSE. The host pinned ORCH_CLAUDE_MODEL=claude-opus-5, so the thin posture was
  # never in force and the heaviest tier was burning the scarcest quota.
  # Ground truth at the time of correction, re-run rather than trusted:
  #   `bash orchestrator/launch.sh model` -> claude_model=claude-opus-5
  # Applies at the next relaunch; runtime.env is the host pin that enforces it.
  top_model_source: runtime.env    # host pin; orchestrator/launch.sh CLAUDE_MODEL is the fallback default
  top_model_status: pinned         # orchestrator/model-command.test.sh locks the emitted --model;
  # ORCH_CLAUDE_MODEL in runtime.env overrides the source default per host, and
  # the Telegram /model command writes that same name, so an operator switch and
  # this pin cannot disagree.
  # CLOSED 2026-07-31: he was asked and he ruled — instance/decisions/HR-269.md
  # carries his verbatim words. This is now a Human ruling, not an as-run record.
  # Escalation tier reachable from Telegram (`/model fable`); switch up for a
  # hairy incident, back down after. Selectable set: daemon/model-registry.ts.
  escalation_model: claude-fable-5 # instance/handoff-oldorch-2026-07-30.md §1; verified runnable 2026-07-30
  lean_model: claude-sonnet-5      # ibid (thin/lean top); verified runnable 2026-07-30
  model_switch: telegram-/model    # daemon/server.ts handleModelCommand; relaunch-scoped, persisted to runtime.env
  manager_provider: codex          # ibid — Codex managers between orchestrator and workers
  coder_provider: codex            # ibid — Codex coders below the managers
  # Fallback/alternate top orchestrator (instructions/orchestrator-fallback.md,
  # instance/decisions/HR-11573.md). The model is now pinned in source
  # (orchestrator/launch.sh CODEX_MODEL) rather than left to the account default,
  # so a fresh clone with no runtime.env still starts codex on this model;
  # ORCH_CODEX_MODEL in runtime.env overrides it per host.
  fallback_provider: codex
  fallback_model: gpt-5.6-sol      # /root/.codex/config.toml; verified runnable on this box 2026-07-30
  fallback_model_status: pinned    # orchestrator/codex-notify-wiring.test.sh locks the emitted --model
  fallback_reasoning_effort: high  # codex-cli defaults to `none`, inadequate for orchestrator judgement

capture:
  # How Human directives reach the decisions ledger. `manual`: the orchestrator
  # captures every directive by hand before dispatch; a missing inbox transport is
  # a visible degraded mode, not "no special handling". Flip to `daemon` only when
  # the mirror is proven live writing instance/decisions/inbox.jsonl.
  mode: manual                     # instructions/orchestrator-fallback.md, instruction-layers.md (daemon mirror planned, not yet wired)

db:
  legacy_carry_over: none          # instructions/repo-layout.md (msg 11543: no legacy DB carry-over)
