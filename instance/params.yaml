# Instance parameters for this BPA control-plane deployment.
#
# Every value here is a this-installation fact. Generic instructions/ rules cite
# these parameters by name instead of hard-coding a name or number. Each entry
# cites the source doc in THIS repo that establishes it. No secrets/tokens/keys.

operator:
  name: Vova                       # instructions/repo-layout.md, STACK_DECISION.md verbatim blocks (Vova)
  language: uk                     # CLAUDE.md Hard Rule 17 (chat with the Human in Ukrainian)
  timezone: Europe/Warsaw          # migration-prep/HUMAN_REQUIREMENTS_MATRIX_2026-07-28.md (Kraków clock; morning rhythm)

phase:
  current: sole-mission            # instance/README + CLAUDE.md Mission (this repo is the sole current mission)
  # Predicate used by instruction `sunset:` frontmatter, per
  # migration-prep/INSTRUCTIONS_CONSILIUM_FINAL.md §2.1, §4.2.
  active_scope: v3-infrastructure-to-cutover   # instance/decisions/HR-2401.md (Vova 2401):
  # active work is the v3 control plane and the orchestrator, bounded by HR-2369 (repair
  # only what blocks the product), until the cutover gates A-G in
  # instance/consilium-cutover-2026-08-04-evening-synthesis.md are green. Product work
  # begins on his word (HR-2398), not by inference from this line.
  #
  # WAS instruction-mechanics-only, from HR-11570 (2026-07-29). That restriction bounded
  # itself with "until the Human says otherwise" and he did — HR-1746/1749 (repo
  # architecture), HR-2335 (cutover to a new server = HR-11570's parked item 2 by name),
  # HR-2369, and 347 commits of v3 that were not instruction tooling. It stayed here for
  # six days and was compiled into the INSTANCE FACTS header of every pack every lane
  # received (compose.ts:434), so every agent was told the scope was instructions only.
  # Nothing caught it because active_scope has no validated vocabulary — compose.ts
  # requires the key and prints the value, and checks nothing.
  #
  # HR-11570's other half is NOT superseded: "дуууже ретельно все протестуй" stands.

repos:
  control_plane: bpa-dev-infrastructure   # instructions/repo-layout.md (this repo, control plane only)
  framework: planned                      # instructions/repo-layout.md (a NEW separate repo, not yet created)
  per_agent: planned                      # instructions/repo-layout.md (one NEW repo per agent: Bill, Mila, future)
  legacy_donors:                          # instructions/repo-layout.md (read-only donors, deleted over time)
    - bpa-master
    - agent-bill
    - agent-mila
  legacy_rescue_branch: rescue/vm-final-20260728   # instructions/repo-layout.md
  canonical_root: /root/bpa-dev-infrastructure     # AS BUILT on bpa-infra after the 2026-07-30 cutover.
  account: root                     # SYSTEM-unit deployment contract; bootstrap refuses non-root activation.
  git_remote: git@github.com:vovaBPApro/bpa-dev-infrastructure.git  # instance/migration-day.md (clone step)

vm:
  os: Ubuntu 24.04                 # instance/migration-day.md
  host: bpa-infra                  # AS BUILT (hostname), 2026-07-30 cutover per instance/decisions/HR-11736.md
  ip: 144.76.185.238               # AS BUILT, cutover target named in instance/decisions/HR-11736.md
  cores: 12                        # AS BUILT (nproc)
  ram_gb: 251                      # AS BUILT (free -g). The 64 GB in migration-day.md / repo-layout.md
  # (msg 11555) was Vova's sizing FLOOR, not this box; the delivered machine exceeds it.

fleet:
  # ACTIVE. The lane number here is the operator's cap of 2026-08-05:
  # instance/decisions/HR-2456.md — «Дозволяю підняти ліміт лейнів до 5».
  # It amends instance/decisions/HR-2342.md («Давай там до трьох», 2026-08-04)
  # in the NUMBER ONLY, and leaves instance/decisions/HR-2398.md's per-repository
  # scope and its «не швидкість а надійний і впевнений рух» framing intact. All
  # three declare `lane_cap:` as a machine-readable field; the two superseded
  # numbers carry `lane_cap_superseded_by: HR-2456`, and tools/check-fleet-cap.ts
  # refuses any value here that disagrees with the live one.
  #
  # FIVE IS THE EDGE, NOT HEADROOM. Workboard row V3-0.34 measured this host
  # saturating at exactly five concurrent lanes: 12 cores, load average 16.46,
  # with the suite stretching under load (98s idle -> 112.87s at six workers ->
  # 115.19s at twelve, where the deadline then killed a passing run). So the cap
  # now sits ON the measured saturation point rather than below it. He authorised
  # running there and that is his call; the obligation it creates is to watch the
  # suite's runtime at five and report degradation rather than absorb it, because
  # the suite is this system's measurement instrument — above capacity the fleet
  # gets faster and its evidence gets less trustworthy at the same moment. The
  # derived budget is still V3-0.34 and still open; this is a ruling, not a
  # derivation.
  #
  # SUPERSEDES the `floor: 10` / `ceiling: 15` pair this block carried from
  # instance/decisions/HR-281.md (2026-07-31, «У тебе задача — десять лейнів
  # стабільно тримати»). That pair was not inert: daemon/autonomy-keepalive.ts
  # read `floor` live, so every census under ten read as below floor against a
  # binding cap of three, and tools/instructions/session-load.ts pushes this file
  # into the orchestrator's standing context at every session start, so each new
  # session was told to hold ten lanes (audit finding F1,
  # instance/audits/false-facts-2026-08-04.md).
  cap: 3                           # instance/decisions/HR-2538.md (amending HR-2456.md, which amended HR-2342.md + HR-2398.md): max parallel lanes, PER REPOSITORY.
  # THREE, with five as an EXCEPTION rather than the default — HR-2538 lowered it
  # the same day HR-2456 raised it, and the reason is contention on one
  # integration branch, not machine capacity: "якщо в мене два-три репозиторії,
  # тоді можна 10-15 розганяти, бо вони принаймні в рамках одного репозиторія в
  # main конфліктувати одне з одним не будуть." So parallelism scales by
  # REPOSITORY COUNT, never by raising this number.
  #
  # The evidence that lowered it is rework, not failure: V3-5.1 — the most
  # important row on the board — needed three rebases and three review passes,
  # none caused by a defect in the change. Its second re-attestation called that
  # "a serialization failure in dispatch". A branch that already held an ACCEPT
  # was displaced by a landing begun after it.
  #
  # A CEILING, not a target. HR-2342: "fewer is allowed whenever the work does
  # not need them." — untouched by the raise to five. There is deliberately no
  # floor/target key: every count from 1 to the cap is permitted, so the only
  # lane count that can be a fault is ZERO, and the wake thresholds below are 1
  # for that reason rather than by taste. THE THRESHOLDS DO NOT MOVE WITH THE
  # CAP: "idle" means zero running lanes whether the cap is 3, 5 or 10, and
  # letting five leak into a threshold would re-install the ceiling as a floor —
  # the defect this block was rewritten to remove. Replacing an underived 10
  # with an underived 5 is the same defect with a different number; the
  # capacity-derived budget is workboard row V3-0.34 and nothing states a target
  # until it exists.
  wake_below: 1                    # daemon/autonomy-keepalive.ts: nudge the ORCHESTRATOR only when the fleet is doing nothing.
  notify_human_below: 1            # orchestrator/watchdog.sh: message HIM only when the fleet is idle, never at 1-2 lanes.
  # HR-281's literal «менше трьох … маєш мені писати» was given when the
  # configured floor was ten, so "fewer than three" then named a fleet that had
  # nearly stopped. Under a cap of three — or five — it names ordinary
  # operation, and a wider cap only makes it more ordinary. The intent
  # is kept and the arithmetic is not — the reasoning is in
  # instructions/autonomy-and-capacity.md, which already states it in prose.
  keepalive_interval_minutes: 15   # daemon timer backstop; independent of lane exit events
  status: active
  # The fail-closed idle enforcer, named honestly: the timer watchdog is what
  # actually measures it. Open work plus zero running lanes wakes the
  # orchestrator and tells the operator once; a board that cannot be parsed is
  # refused rather than counted as "no work". The state-contract checker this
  # key named until now has never existed (audit finding F6).
  fleet_idle_check: orchestrator/fleet/fleet-nudge.sh
  fleet_idle_backstop: daemon/autonomy-keepalive.ts   # the 15-minute in-daemon backstop; shares the counter above

orchestrator:
  session: bpa-orchestrator          # bootstrap/env.template: one instance session for launcher + watchdog
  watchdog_interval_seconds: 600     # bootstrap/env.template and rendered watchdog timer
  watchdog_restart_failure_alert_after: 3  # loud Human alert after bounded consecutive failures
  # A doc in THIS repo now states the vendor shape, so the long-standing "no
  # model/vendor map here" omission is lifted for these keys only.
  top_provider: claude             # HUMAN RULING: instance/decisions/HR-709.md (Vova, 2026-08-01).
  # SUPERSEDES HR-271 item 1. He corrected the record: Codex gpt-5.6-sol is a
  # quota-exhaustion FALLBACK only, not the resting top-orchestrator provider.
  top_posture: thin                # unchanged in KIND — routing/decisions/Human contact only
  # Pinned in source (orchestrator/launch.sh CLAUDE_MODEL) for the same reason
  # as fallback_model below: an unpinned claude launch emits no --model and the
  # top orchestrator silently becomes the account default.
  top_model: claude-fable-5        # HUMAN RULING: instance/decisions/HR-709.md (Vova, 2026-08-01).
  # SUPERSEDES HR-269 item 1 and HR-271's "Claude reserved entirely" framing.
  # Rest on FABLE, not Sonnet, not Opus, not Codex. His words: "на fable було
  # мінімальне навантаження... всі дочірні агенти піднімаються на кодексах".
  # Child/lane agents stay on Codex (HR-269 item 2 / HR-271, unchanged) and must
  # be lean/autonomous enough not to round-trip the top orchestrator often — the
  # goal is minimizing FABLE quota burn, not avoiding Claude altogether.
  # DRIFT FOUND 2026-08-01: `bash orchestrator/launch.sh model` already reported
  # claude_model=claude-fable-5 (the runtime.env pin was already correct) at the
  # moment this ruling arrived, yet the LIVE session was running claude-sonnet-5.
  # The restart path that brought this session up did not honor the pin — a
  # separate open defect, not resolved by this key. See workboard.
  top_model_source: runtime.env    # host pin; orchestrator/launch.sh CLAUDE_MODEL is the fallback default
  top_model_status: pinned         # orchestrator/model-command.test.sh locks the emitted --model;
  # ORCH_CLAUDE_MODEL in runtime.env overrides the source default per host, and
  # the Telegram /model command writes that same name, so an operator switch and
  # this pin cannot disagree.
  # Escalation tier reachable from Telegram (`/model fable`); switch up for a
  # hairy incident, back down after. Selectable set: daemon/model-registry.ts.
  # NOTE: fable is now the RESTING tier (top_model above), not escalation-only —
  # HR-709 repurposed it. This key name is stale (kept as the Telegram catalog
  # label, not a claim about posture); do not read it as contradicting top_model.
  escalation_model: claude-fable-5 # instance/handoff-oldorch-2026-07-30.md §1; verified runnable 2026-07-30
  lean_model: claude-sonnet-5      # ibid (thin/lean top); verified runnable 2026-07-30
  model_switch: telegram-/model    # daemon/server.ts handleModelCommand; relaunch-scoped, persisted to runtime.env
  manager_provider: codex          # ibid — Codex managers between orchestrator and workers
  coder_provider: codex            # ibid — Codex coders below the managers
  # Fallback/alternate top orchestrator (instructions/orchestrator-fallback.md,
  # instance/decisions/HR-11573.md). The model is now pinned in source
  # (orchestrator/launch.sh CODEX_MODEL) rather than left to the account default,
  # so a fresh clone with no runtime.env still starts codex on this model;
  # ORCH_CODEX_MODEL in runtime.env overrides it per host.
  fallback_provider: codex
  fallback_model: gpt-5.6-sol      # /root/.codex/config.toml; verified runnable on this box 2026-07-30
  fallback_model_status: pinned    # orchestrator/codex-notify-wiring.test.sh locks the emitted --model
  fallback_reasoning_effort: high  # codex-cli defaults to `none`, inadequate for orchestrator judgement

capture:
  # How Human directives reach the decisions ledger. `manual`: the orchestrator
  # captures every directive by hand before dispatch; a missing inbox transport is
  # a visible degraded mode, not "no special handling". Flip to `daemon` only when
  # the mirror is proven live writing instance/decisions/inbox.jsonl.
  mode: manual                     # instructions/orchestrator-fallback.md, instruction-layers.md (daemon mirror planned, not yet wired)

ledger:
  # Ceiling on how far ahead an HR row may be parked, enforced by
  # tools/instructions/ledger.ts:checkHrAging(). `review-by:` was mandatory and
  # bit when past, but had no upper bound, so `review-by: 2099-01-01` was green,
  # undelivered and uncounted. The rule is generic; this number is ours. One
  # quarter: long enough for a real park (a decision waiting on the operator, a
  # row blocked on the cutover), short enough that the row comes back while the
  # reason for parking it is still legible.
  parked_horizon_days: 90          # round-2 review of V3-3.1, finding 5

db:
  legacy_carry_over: none          # instructions/repo-layout.md (msg 11543: no legacy DB carry-over)
