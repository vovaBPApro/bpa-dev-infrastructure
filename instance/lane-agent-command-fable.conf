# One argv entry per line. The generic launcher treats this file as data and
# does not know the provider; this file is the this-installation fact.
#
# 2026-08-04: worker lanes run on Anthropic by operator instruction (Telegram
# 2082) — the Codex weekly limit was down to 6% remaining with 0 credits, while
# the Anthropic quota had just reset. The previous Codex argv is retained at
# instance/lane-agent-command-codex.conf so switching back is a one-line change,
# not an archaeology exercise.
#
# IS_SANDBOX=1 is required because lanes still run as root on this host: the
# claude CLI refuses --dangerously-skip-permissions under root without it. That
# is a symptom of V3-1.9 (non-root lanes) not having landed, not a preference.
#
# 2026-08-04, V3-0.51: declares the foreground-command bound this harness
# applies. Rationale, measurements, and the re-run command have one home —
# instance/lane-agent-command.conf. Keep the two numbers equal to that file's:
# a variant conf that silently runs under a different bound is the drift this
# declaration exists to remove.
env
IS_SANDBOX=1
BASH_DEFAULT_TIMEOUT_MS=1800000
BASH_MAX_TIMEOUT_MS=1800000
claude
--print
--dangerously-skip-permissions
--model
claude-fable-5
