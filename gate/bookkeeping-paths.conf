# One repository-relative path prefix per line. gate/bookkeeping-push.sh will
# publish a commit to the integration branch ONLY when every path it touches
# matches one of these prefixes.
#
# This list is the security boundary that stops the bookkeeping fence from
# becoming a landing bypass. It is deliberately narrow: `instance/` is this
# installation's own facts -- workboard rows, the review-item registry, the
# decisions ledger, handoff notes -- which the orchestrator writes as
# bookkeeping and which no lane produces as a reviewed artifact.
#
# Invariant, enforced at run time by gate/bookkeeping-push.sh (not just
# documented here): no prefix in this file may overlap any prefix in
# gate/review-policy.conf, in either direction. That makes it structurally
# impossible to push a change through this path that the landing gate would
# have required an independent review for.
instance/
