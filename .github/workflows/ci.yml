name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Lint shell scripts
        run: find . -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck --exclude=SC2034,SC2015,SC2016
      - name: Run shell tests
        run: |
          bootstrap/bootstrap.test.sh
          hygiene/reap.test.sh
          orchestrator/runtime.test.sh

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Run Bun tests
        run: |
          if [[ -d daemon ]]; then
            bun test stand daemon
          else
            bun test stand
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Scan for credentials
        shell: bash
        run: |
          secret_pattern='[0-9]{8,10}:AA[A-Za-z0-9_-]|'
          secret_pattern+='gh''p_|github''_pat_|client''_secret|'
          secret_pattern+='-----''BEGIN [A-Z ]*PRIVATE KEY'
          if grep -rE --exclude-dir=.git "$secret_pattern" .; then
            echo 'ERROR: credential-like value detected' >&2
            exit 1
          else
            scan_status=$?
            if [[ "$scan_status" -ne 1 ]]; then
              exit "$scan_status"
            fi
          fi
